<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Sizing</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5d6573; --line: #e2e5ea;
  --accent: #2f5bd3; --accent-ink: #ffffff; --ok: #1f7a4d; --warn: #9a6500; --bad: #b42318;
  --w: #2f5bd3; --f: #8a94a6; --k: #18a37b; --free: #e8ebf0;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #98a1b0; --line: #2a3039;
    --accent: #6d8ff0; --accent-ink: #0f1216; --ok: #4cc38a; --warn: #e0a83a; --bad: #f07067;
    --w: #6d8ff0; --f: #6b7486; --k: #38c79b; --free: #262c35;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1180px; margin: 0 auto; }
header h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
main { max-width: 1180px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
form { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: end; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.wide { grid-column: span 3; }
.checks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink); grid-column: span 4; }
.checks label { display: flex; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
.checks input { width: auto; }
button { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 7px; padding: 9px 14px; cursor: pointer; grid-column: span 2; }
button:disabled { opacity: .6; cursor: progress; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.err { color: var(--bad); white-space: pre-wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 6px; font-size: 13px; }
.facts b { font-weight: 600; }
h2 { font-size: 16px; margin: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
tr.best td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--free); min-width: 120px; margin-top: 5px; }
.bar span { display: block; height: 100%; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.nt summary { list-style: none; margin-top: 3px; } .nt summary::-webkit-details-marker { display: none; }
.notes { max-width: 520px; margin: 4px 0 0; padding-left: 16px; color: var(--warn); font-size: 12px; }
.scroll { overflow-x: auto; }
.ctx { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: var(--muted); min-height: 22px; margin-top: -4px; }
.ctx b { color: var(--ink); font-weight: 600; }
.chip { font: inherit; font-size: 12px; font-weight: 500; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; grid-column: auto; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ctx .warn { color: var(--warn); }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
@media (max-width: 760px) {
  td:first-child { min-width: 112px; }
  .bar { min-width: 70px; }
  form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wide, .checks, button { grid-column: span 2; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>GPU Sizing</h1>
  <p id="meta">GPU memory for any Hugging Face model: weights, KV cache and fixed costs. No speed estimates.</p>
</header>
<main>
  <section class="panel">
    <form id="f">
      <label class="wide">Model (Hugging Face repo)
        <input name="model" list="models" placeholder="Qwen/Qwen3-32B" required autocomplete="off" spellcheck="false">
        <datalist id="models"></datalist>
      </label>
      <label>Context (per request)
        <input name="tokens" placeholder="model max" spellcheck="false">
      </label>
      <label>Typical request
        <input name="typicalTokens" placeholder="context / 2" spellcheck="false">
      </label>
      <label>Concurrent requests
        <input name="concurrent" type="number" min="1" placeholder="e.g. 32">
      </label>
      <div class="ctx" id="ctx" aria-live="polite"></div>
      <label>Engine
        <select name="engine"><option value="vllm">vLLM</option><option value="sglang">SGLang</option></select>
      </label>
      <label>KV cache
        <select name="cache"><option value="fp8">FP8</option><option value="auto">Model dtype (BF16)</option></select>
      </label>
      <label>Variant folder
        <input name="variant" placeholder="(root)" spellcheck="false">
      </label>
      <div class="checks">
        <label><input type="checkbox" name="textOnly"> Language model only (no vision)</label>
        <label><input type="checkbox" name="refresh"> Re-read from Hugging Face</label>
        <label><input type="checkbox" id="dc" checked> Datacenter cards only</label>
      </div>
      <button id="go" type="submit">Calculate</button>
    </form>
  </section>
  <section id="out"></section>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const gib = (n) => (n >= 100 ? n.toFixed(0) : n.toFixed(1));
// Tokens as people write them: 131072 → 128k, 1048576 → 1M, and decimal round figures (1,000,000 → 1M) too.
const ktok = (n) => (n >= 1048576 && n % 1048576 === 0 ? n / 1048576 + 'M' : n >= 1e6 && n % 1e6 === 0 ? n / 1e6 + 'M' : n >= 1024 ? Math.round(n / 1024) + 'k' : String(n));
// What a chip types: the short form when it reads back exactly, otherwise the plain number.
const tokArg = (n) => (ctxTokens(ktok(n)) === n ? ktok(n) : String(n));
const layoutText = (l) => (l.pp > 1 ? `TP${l.tp} × PP${l.pp}` : `TP${l.tp}`);

fetch('api/meta').then((r) => r.json()).then((m) => {
  const eng = m.engines.map((e) => `${e.engine} ${e.version}`).join(', ');
  $('#meta').textContent = `GPU memory for any Hugging Face model. Compatibility: ${eng} (checked ${m.compatCheckedOn}) · GPU catalog ${m.hardwareCheckedOn}` + (m.hfToken ? '' : ' · no HF token: gated models cannot be read');
  if (m.builtinModels) $('#models').innerHTML = m.builtinModels.repos.map((r) => `<option value="${esc(r)}">`).join('');
}).catch(() => {});

function bar(l) {
  const total = l.engineGiB;
  const fixed = (l.fixedGiB[0] + l.fixedGiB[1]) / 2;
  const used = l.weightsGiB + fixed + l.kvPerRequestGiB;
  const pct = (x) => Math.max(0, Math.min(100, (x / Math.max(total, used)) * 100)).toFixed(1) + '%';
  return `<div class="bar" title="weights ${gib(l.weightsGiB)} · fixed ${gib(fixed)} · KV of 1 full request ${gib(l.kvPerRequestGiB)} / engine share ${gib(total)} GiB">
    <span style="width:${pct(l.weightsGiB)};background:var(--w)"></span><span style="width:${pct(fixed)};background:var(--f)"></span><span style="width:${pct(l.kvPerRequestGiB)};background:var(--k)"></span></div>`;
}

function notes(l) {
  const n = [...l.compat.notes];
  if (l.pipeline) n.push('Pipeline parallelism is not verified for this model.');
  return n.length ? `<details class="nt"><summary><span class="tag warn">${n.length} ${n.length === 1 ? 'warning' : 'warnings'}</span></summary><ul class="notes">${n.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : '';
}

// The model's context, read from its config.json as soon as a repo id is typed.
let info;
const REPO = /^[\w.-]+\/[\w.-]+$/;
function ctxTokens(v) {
  const m = /^(\d+(?:\.\d+)?)([kKmM]?)$/.exec(String(v).trim());
  return m ? Math.round(Number(m[1]) * (m[2] === '' ? 1 : /k/i.test(m[2]) ? 1024 : 1048576)) : null;
}
function showCtx() {
  const el = $('#ctx');
  if (!info) { el.innerHTML = ''; return; }
  if (info.error) { el.innerHTML = `<span class="warn">${esc(info.error)}</span>`; return; }
  const max = info.contextLength;
  const doc = info.documentedMaxContext && info.documentedMaxContext > (max ?? 0) ? info.documentedMaxContext : null;
  const tokensInput = $('input[name=tokens]');
  const cur = ctxTokens(tokensInput.value);
  const picks = [8192, 32768, 131072].filter((n) => !max || n < max);
  if (max) picks.push(max);
  if (doc) picks.push(doc);
  const chip = (n) => `<button type="button" class="chip${cur === n ? ' on' : ''}" data-t="${tokArg(n)}">${ktok(n)}${n === max ? ' (max)' : n === doc ? ' (YaRN)' : ''}</button>`;
  const over = cur && max && cur > (doc ?? max);
  el.innerHTML = max
    ? `Model context: <b>${ktok(max)}</b>${doc ? ` · up to <b>${ktok(doc)}</b> with rope scaling (model card)` : ''} ${picks.map(chip).join('')}${over ? `<span class="warn">above what the model supports</span>` : ''}`
    : '<span>config.json gives no context length: enter one.</span>';
  tokensInput.placeholder = max ? `${ktok(max)} (model max)` : 'required';
}
let infoFor = '';
async function loadInfo() {
  const repo = $('input[name=model]').value.trim();
  const variant = $('input[name=variant]').value.trim();
  const key = repo + '|' + variant;
  if (key === infoFor) return;
  infoFor = key;
  if (!REPO.test(repo)) { info = undefined; showCtx(); return; }
  $('#ctx').textContent = 'Reading config.json…';
  try {
    const r = await fetch(`api/model?repo=${encodeURIComponent(repo)}&variant=${encodeURIComponent(variant)}`);
    const j = await r.json();
    if (infoFor !== key) return;
    info = r.ok ? j : { error: j.error };
  } catch (e) { info = { error: e.message }; }
  showCtx();
}
let timer;
for (const n of ['model', 'variant']) {
  $(`input[name=${n}]`).addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadInfo, 600); });
  $(`input[name=${n}]`).addEventListener('change', loadInfo);
}
$('input[name=tokens]').addEventListener('input', showCtx);
$('#ctx').addEventListener('click', (e) => {
  const t = e.target.closest('.chip');
  if (!t) return;
  $('input[name=tokens]').value = t.dataset.t;
  showCtx();
});

let last;
function render(p) {
  last = p;
  const m = p.model;
  const load = p.concurrent !== undefined;
  const shown = $('#dc').checked ? p.cards.filter((c) => c.segment === 'datacenter') : p.cards;
  const fits = shown.filter((c) => (load ? c.forLoad : c.minimal));
  const rest = shown.filter((c) => !(load ? c.forLoad : c.minimal));
  const src = m.source.kind === 'built-in' ? `built-in data (${m.source.date})` : m.source.kind === 'network' ? 'Hugging Face (live)' : 'cache';
  const rows = fits.map((c, i) => {
    const l = load ? c.forLoad.layout : c.minimal;
    return `<tr class="${i === 0 ? 'best' : ''}">
      <td><b>${esc(c.gpu)}</b><div class="muted small">${gib(c.cardGiB)} GiB · ${c.serverGpus} per server</div>${notes(l)}</td>
      <td>${l.gpusPerCopy}× <span class="muted">${layoutText(l)}</span>${bar(l)}</td>
      <td class="num">${gib(l.weightsGiB)}</td>
      <td class="num hide-sm">${gib(l.kvPerRequestGiB)}</td>
      <td class="num hide-sm">${gib(l.fixedGiB[0])}–${gib(l.fixedGiB[1])}</td>
      <td class="num">${l.concurrent}</td>
      ${load ? `<td class="num">${c.forLoad.copies}</td><td class="num"><b>${c.forLoad.gpus}</b></td><td class="num">${c.forLoad.servers}</td>` : ''}
    </tr>`;
  }).join('');
  $('#out').innerHTML = `
  <div class="panel">
    <div class="head"><h2>${esc(m.repo)}${m.variant ? ' / ' + esc(m.variant) : ''}</h2><span class="muted small">${src}</span></div>
    <div class="facts">
      <span>Format <b>${esc(m.format)}</b></span><span>Architecture <b>${esc(m.family)}</b></span>
      <span>Context <b>${ktok(m.workload.maxContext)}</b>${m.modelMaxContext ? ` <span class="muted">(model max ${ktok(m.modelMaxContext)})</span>` : ''}</span>
      <span>Typical request <b>${ktok(m.workload.typicalContext)}</b></span>
      <span>Engine <b>${esc(m.engine)}</b></span><span>KV <b>${esc(m.cache)}</b></span>
      ${load ? `<span>Concurrent requests <b>${p.concurrent}</b></span>` : ''}
      ${m.hasVision && !m.textOnly ? '<span class="muted">vision encoder included</span>' : ''}
      ${m.compatChecked ? '' : '<span class="tag warn">not in the compatibility matrix</span>'}
    </div>
  </div>
  <div class="panel">
    <div class="head"><h2>${load ? `For ${p.concurrent} concurrent requests` : 'Smallest layout the model fits'}</h2>
      <div class="legend"><span><i style="background:var(--w)"></i>weights</span><span><i style="background:var(--f)"></i>fixed costs</span><span><i style="background:var(--k)"></i>KV of 1 full request</span></div></div>
    ${fits.length ? `<div class="scroll"><table>
      <thead><tr><th>Card</th><th>Per copy</th><th class="num">Weights/GPU</th><th class="num hide-sm">KV/request/GPU</th><th class="num hide-sm">Fixed/GPU</th><th class="num">Requests/copy</th>
      ${load ? '<th class="num">Copies</th><th class="num">GPUs</th><th class="num">Servers</th>' : ''}</tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="muted small">GiB per GPU. "Requests/copy": requests of the typical length whose KV cache fits at once, with an ${Math.round(m.workload.safety * 100)}% safety margin. Memory only: speed and latency need a benchmark.</p>`
      : '<p class="err">This model does not fit in one server of any card.</p>'}
    ${rest.length ? `<details><summary>Cards that do not fit or start (${rest.length})</summary><ul class="small">${rest.map((c) => `<li><b>${esc(c.gpu)}</b>: <span class="muted">${esc(c.reason ?? 'does not fit')}</span></li>`).join('')}</ul></details>` : ''}
  </div>`;
}

$('#dc').addEventListener('change', () => last && render(last));
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = { model: fd.get('model').trim(), engine: fd.get('engine'), cache: fd.get('cache'), textOnly: fd.get('textOnly') === 'on', refresh: fd.get('refresh') === 'on' };
  for (const k of ['tokens', 'typicalTokens', 'variant']) { const v = fd.get(k).trim(); if (v) body[k] = v; }
  const c = Number(fd.get('concurrent')); if (c > 0) body.concurrent = Math.round(c);
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Calculating…';
  try {
    const r = await fetch('api/plan', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) $('#out').innerHTML = `<div class="panel err">${esc(j.error)}</div>`;
    else render(j);
  } catch (err) {
    $('#out').innerHTML = `<div class="panel err">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Calculate'; }
});
</script>
</body>
</html>
