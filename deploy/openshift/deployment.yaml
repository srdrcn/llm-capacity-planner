apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-sizing
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"gpu-sizing:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"web\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-sizing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-sizing
    spec:
      containers:
        - name: web
          image: gpu-sizing:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gpu-sizing
            - secretRef:
                name: gpu-sizing-hf
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            # Hugging Face answers (configs, safetensors headers): a few MB per model.
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
