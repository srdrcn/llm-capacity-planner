apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-sizing
data:
  # Outbound proxy to huggingface.co (delete both lines without one).
  HTTPS_PROXY: http://proxy.example:3128
  NO_PROXY: .cluster.local,.svc,localhost,127.0.0.1
  # An internal Hugging Face mirror instead (Artifactory / Nexus remote repository):
  # HF_ENDPOINT: https://artifactory.example/artifactory/api/huggingfaceml/huggingface
  PLAN_CONCURRENCY: "4"
